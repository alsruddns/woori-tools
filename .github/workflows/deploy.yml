name: Deploy tools

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/deploy.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: tools-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/alsruddns/woori-tools:latest
            ghcr.io/alsruddns/woori-tools:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX

      - name: Record immutable Tools image digest
        run: |
          echo "Tools image digest: ${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on iwinv
        id: deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          OLD_IMAGE_ID="$(ssh "$SERVER_USER@$SERVER_HOST" 'docker inspect --format "{{.Image}}" tools')"
          echo "old_image_id=$OLD_IMAGE_ID" >> "$GITHUB_OUTPUT"
          ssh "$SERVER_USER@$SERVER_HOST" "bash -s -- '$IMAGE_SHA'" <<'REMOTE'
            set -euo pipefail
            image_sha="$1"
            cd /opt/services/compose
            compose=(docker compose --env-file .env.moneybook --env-file .env.portal)
            image="ghcr.io/alsruddns/woori-tools:sha-${image_sha}"
            latest="ghcr.io/alsruddns/woori-tools:latest"
            docker exec nginx nginx -t
            "${compose[@]}" config --quiet
            docker pull "$image"
            docker image tag "$image" "$latest"
            "${compose[@]}" up -d --no-deps --pull never --wait --wait-timeout 120 tools
            expected="$(docker image inspect "$image" --format '{{.Id}}')"
            running="$(docker inspect tools --format '{{.Image}}')"
            test "$running" = "$expected"
            docker exec nginx nginx -t
            docker exec nginx nginx -s reload
            echo "Tools image verified at $running; Nginx validated and gracefully reloaded."
          REMOTE

      - name: Verify deployed Tools image routes and sitemap
        id: image_verify
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" 'docker exec -i tools node -' <<'NODE'
          (async () => {
            const paths = ["/fil/tools/tarot-card", "/bn/tools/json-formatter", "/el/tools/daily-fortune"];
            for (const path of paths) {
              const response = await fetch(`http://127.0.0.1:3002${path}`);
              console.log(`Tools loopback ${path}: HTTP ${response.status}`);
              if (!response.ok) process.exitCode = 1;
            }
            const response = await fetch("http://127.0.0.1:3002/sitemap.xml");
            if (!response.ok) throw new Error(`Tools loopback sitemap: HTTP ${response.status}`);
            const xml = await response.text();
            const details = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((match) => match[1]).filter((url) => {
              const path = new URL(url).pathname.split("/").filter(Boolean);
              return path.length === 3 && path[1] === "tools";
            });
            console.log(`Tools loopback sitemap detail URLs: ${details.length}`);
            if (details.length !== 4576) process.exitCode = 1;
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Check production health and SEO
        id: health
        env:
          PRODUCTION_BASE_URL: https://www.woori.today
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/check-production-tools-smoke.mjs

      - name: Roll back Tools if deployment health check fails
        id: rollback
        if: failure() && steps.deploy.outputs.old_image_id != '' && (steps.deploy.outcome == 'failure' || steps.image_verify.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          OLD_IMAGE_ID: ${{ steps.deploy.outputs.old_image_id }}
        run: |
          set -euo pipefail
          ssh "$SERVER_USER@$SERVER_HOST" "bash -s -- '$OLD_IMAGE_ID'" <<'REMOTE'
            set -euo pipefail
            old_image_id="$1"
            cd /opt/services/compose
            compose=(docker compose --env-file .env.moneybook --env-file .env.portal)
            docker image tag "$old_image_id" ghcr.io/alsruddns/woori-tools:latest
            "${compose[@]}" up -d --no-deps --pull never --wait --wait-timeout 120 tools
            test "$(docker inspect tools --format '{{.Image}}')" = "$old_image_id"
            docker exec nginx nginx -t
            docker exec nginx nginx -s reload
          REMOTE
          test "$(ssh "$SERVER_USER@$SERVER_HOST" 'docker inspect --format "{{.Image}}" tools')" = "$OLD_IMAGE_ID"
          ssh "$SERVER_USER@$SERVER_HOST" 'docker exec -i tools node -' <<'NODE'
          (async () => {
            const response = await fetch("http://127.0.0.1:3002/ko/tools/json-formatter");
            console.log(`Rollback Tools loopback: HTTP ${response.status}`);
            if (!response.ok) process.exitCode = 1;
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "https://www.woori.today/robots.txt?rollback_check=$GITHUB_SHA" > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused "https://www.woori.today/ko/tools/json-formatter?rollback_check=$GITHUB_SHA" > /dev/null

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_BASE_SHA: ${{ github.event.before }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm exec node scripts/submit-indexnow.mjs
