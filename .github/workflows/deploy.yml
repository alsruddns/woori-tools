name: Deploy tools

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/alsruddns/woori-tools:latest
          build-args: |
            NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX

      - name: Deploy on iwinv
        id: deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          OLD_IMAGE_ID="$(ssh "$SERVER_USER@$SERVER_HOST" 'docker inspect --format "{{.Image}}" tools')"
          echo "old_image_id=$OLD_IMAGE_ID" >> "$GITHUB_OUTPUT"
          ssh "$SERVER_USER@$SERVER_HOST" 'cd /opt/services/compose && docker compose --env-file .env.moneybook --env-file .env.portal pull tools && docker compose --env-file .env.moneybook --env-file .env.portal up -d --no-deps tools'

      - name: Check production health
        id: health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused https://www.woori.today/robots.txt
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused https://www.woori.today/fil/tools/tarot-card
          curl --fail --silent --show-error https://www.woori.today/sitemap.xml | grep -q '/el/tools/daily-fortune'

      - name: Roll back Tools if deployment health check fails
        id: rollback
        if: failure() && steps.deploy.outputs.old_image_id != '' && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          OLD_IMAGE_ID: ${{ steps.deploy.outputs.old_image_id }}
        run: |
          set -euo pipefail
          ssh "$SERVER_USER@$SERVER_HOST" "cd /opt/services/compose && docker image tag '$OLD_IMAGE_ID' ghcr.io/alsruddns/woori-tools:latest && docker compose --env-file .env.moneybook --env-file .env.portal up -d --no-deps tools"
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused https://www.woori.today/robots.txt
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused https://www.woori.today/fil/tools/tarot-card

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_BASE_SHA: ${{ github.event.before }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: pnpm exec node scripts/submit-indexnow.mjs
