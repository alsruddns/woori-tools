# Reference configuration only.
# Production Nginx source of truth:
# /opt/services/nginx/conf.d/default.conf
# Do not deploy this file independently without reconciling
# it with the production default.conf.
#
# This file contains location snippets only. It is not a complete server
# configuration, is not included or deployed automatically, and must not be
# applied without checking the live production configuration.
#
# Docker upstream: tools:3002
# Supported URL locales: ko|en|ja|zh|es|pt-br|de|fr|vi|id|th|zh-tw|it|nl|hi|ru|tr|pl|fil|bn|uk|ms|sv|cs|ro|el

# ---------------------------------------------------------
# Tools Next.js assets
# ---------------------------------------------------------

location ^~ /_assets/tools/_next/ {
    proxy_pass http://tools:3002/_next/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /_assets/tools/ {
    proxy_pass http://tools:3002;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------------------------------------------------
# Legacy redirect
# ---------------------------------------------------------

location = /tools {
    return 301 https://www.woori.today/ko/tools;
}

location = /tools/ {
    return 301 https://www.woori.today/ko/tools;
}

location ~ ^/tools/(.+)$ {
    return 301 https://www.woori.today/ko/tools/$1$is_args$args;
}

# ---------------------------------------------------------
# Tools service
# ---------------------------------------------------------

# Production default.conf defines $valid_locale in a higher-level http block.
# Do not uncomment/copy this map into a file included from that same http block
# without checking for an existing definition; duplicate map declarations can
# prevent Nginx from loading its configuration.
#
# map $uri $valid_locale {
#     default 0;
#     ~^/(ko|en|ja|zh|es|pt-br|de|fr|vi|id|th|zh-tw|it|nl|hi|ru|tr|pl|fil|bn|uk|ms|sv|cs|ro|el)(?:/|$) 1;
# }

location ~ "^/[a-z]{2,3}(?:-[a-z]{2})?/tools(?:/.*)?$" {
    if ($valid_locale = 0) {
        return 404;
    }

    proxy_pass http://tools:3002;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# ---------------------------------------------------------
# Tools sitemap
# ---------------------------------------------------------

location = /tools-sitemap.xml {
    proxy_pass http://tools:3002/sitemap.xml;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
